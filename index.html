<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Quiz Arena — Student Join</title>
  <link rel="stylesheet" href="style.css">
  <script src="sound.js"></script>
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem;">

  <!-- Sound Toggle in Corner -->
  <div style="position: absolute; top: 1.25rem; right: 1.25rem; z-index: 10;">
    <button class="btn-icon" id="sound-toggle-btn" title="Toggle Sound">🔊</button>
  </div>

  <main style="max-width: 440px; width: 100%;">
    <!-- Main Student Join Card -->
    <div class="action-card" style="padding: 2.5rem 2rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      
      <!-- Brand Logo -->
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
        <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem;">⚡</div>
        <div style="text-align: left;">
          <div class="brand-title" style="font-size: 1.6rem; letter-spacing: -0.02em;">QUIZ ARENA</div>
          <div class="brand-sub" style="font-size: 0.8rem; color: #94a3b8;">Live Classroom Challenge</div>
        </div>
      </div>

      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.75rem;">
        Enter the Game PIN shown on the board to join the live arena.
      </p>

      <!-- Student Join Form -->
      <form id="join-form" onsubmit="handleStudentJoin(event)">
        <div class="form-group" style="margin-bottom: 1.25rem; text-align: left;">
          <label class="form-label" style="text-align: center;">GAME PIN</label>
          <input type="text" id="join-pin" class="pin-input" placeholder="000000" maxlength="6" inputmode="numeric" required autofocus autocomplete="off">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem; text-align: left;">
          <label class="form-label" style="text-align: center;">YOUR NICKNAME</label>
          <input type="text" id="join-name" class="text-input" placeholder="Enter your name or nickname" maxlength="25" required autocomplete="off" style="text-align: center; font-size: 1.15rem; font-weight: 700;">
        </div>

        <button type="submit" class="btn btn-kahoot btn-block" style="font-size: 1.25rem; padding: 1rem;">
          ENTER ARENA 🚀
        </button>
      </form>

    </div>

    <div style="text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.8rem;">
      Quiz Arena • Live Classroom Student Portal
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Sound button
      const soundBtn = document.getElementById('sound-toggle-btn');
      soundBtn.textContent = Sound.enabled ? '🔊' : '🔇';
      soundBtn.onclick = () => {
        const on = Sound.toggleSound();
        soundBtn.textContent = on ? '🔊' : '🔇';
      };

      // Check URL parameters (e.g. from QR code ?pin=123456)
      const urlParams = new URLSearchParams(window.location.search);
      const paramPin = urlParams.get('pin');
      if (paramPin) {
        document.getElementById('join-pin').value = paramPin.trim();
        document.getElementById('join-name').focus();
      }
    });

    function handleStudentJoin(e) {
      e.preventDefault();
      Sound.lockIn();
      const pin = document.getElementById('join-pin').value.trim();
      const name = document.getElementById('join-name').value.trim();

      if (!pin || pin.length < 4) {
        alert('Please enter a valid Game PIN.');
        return;
      }
      if (!name) {
        alert('Please enter your name or nickname.');
        return;
      }

      window.location.href = `play.html?pin=${encodeURIComponent(pin)}&name=${encodeURIComponent(name)}`;
    }
  </script>
</body>
</html>
